name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify release baseline
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:4028
      NEXT_PUBLIC_API_URL: http://localhost:4028/api
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sparkle247
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
